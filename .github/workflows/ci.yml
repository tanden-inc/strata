name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache MoonBit toolchain and registry
        uses: actions/cache@v4
        with:
          path: ~/.moon
          key: moon-${{ runner.os }}-${{ hashFiles('moon.mod') }}
          restore-keys: moon-${{ runner.os }}-

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: moon version --all

      - name: Update registry index
        run: moon update

      - name: Format check
        run: make fmt-check

      - name: Type check (native, js)
        run: make check

      - name: Type check pure packages (wasm-gc)
        run: make check-wasm-gc

      - name: Interface drift
        run: make info

      - name: Test (js, per-test panic isolation)
        run: make test-js

      - name: Test (native)
        run: make test

      - name: Test pure packages (wasm-gc)
        run: make test-wasm-gc

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          moon coverage analyze > uncovered.log || true
          tail -n 40 uncovered.log || true
